<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#FFD6BA,#F7C8E0);
}

.container{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
    margin-bottom:20px;
    color:#1F1F1F;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #F7C8E0;
    border-radius:10px;
    margin-bottom:15px;
}

button{
    padding:12px 25px;
    border:none;
    background:#E8A0BF;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

#weatherBox{
    margin-top:20px;
}

#city{
    color:#1F1F1F;
}
</style>
<body>

    <div class="container">
        <h1>Weather App</h1>

        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="searchBtn">Search</button>

        <div id="weatherBox">
            <h2 id="city"></h2>
            <p id="temp"></p>
            <p id="desc"></p>
            <p id="humidity"></p>
        </div>
    </div>

    <script src="task,js"></script>
</body>
</html>
